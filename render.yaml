# Render Blueprint for Securo.
#
# Deploy: Render Dashboard -> New + -> Blueprint -> pick this repo.
#
# NOTE: this deployment was created via the Render CLI, so the live services
# already exist. This file is kept in sync so the stack is reproducible.
#
# Live resources (Budgetflow workspace, free plan):
#   securo-frontend  https://securo-frontend-trrt.onrender.com  (-> securo.opstintechnologies.com)
#   securo-backend   https://securo-backend-zire.onrender.com   (health: /api/health)
#   securo-mcp       https://securo-mcp-dn75.onrender.com       (health: /health, 43 MCP tools)
#   securo-redis     Render Key Value
#   Postgres         EXTERNAL (Supabase, session pooler ap-northeast-1) — not provisioned here
#
# Design notes (Free plan):
#   * No background workers / cron / private services / disks. Celery worker+beat
#     are omitted: bank sync and scheduled jobs stay inert.
#   * Free web services cannot receive private-network traffic, so the frontend
#     proxies /api/ to the backend's PUBLIC *.onrender.com URL, and the backend
#     reaches the MCP server over its public URL.
#   * Migrations run from backend/scripts/render-entrypoint.sh on boot.

envVarGroups:
  # Shared by the backend and the MCP server: the JWT secret they use to talk
  # to each other must match on both sides.
  - name: securo-agents
    envVars:
      - key: AGENTS_ENABLED
        value: "true"
      - key: AGENTS_MCP_JWT_SECRET
        generateValue: true

services:
  - type: keyvalue
    name: securo-redis
    plan: free
    region: oregon
    maxmemoryPolicy: noeviction
    ipAllowList:
      - source: 0.0.0.0/0
        description: internal use only

  - type: web
    name: securo-backend
    runtime: docker
    plan: free
    region: oregon
    branch: main
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/health
    dockerCommand: sh /app/scripts/render-entrypoint.sh
    envVars:
      - fromGroup: securo-agents
      - key: SECRET_KEY
        generateValue: true
      # External managed Postgres (Supabase session pooler). asyncpg driver.
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: securo-redis
          property: connectionString
      - key: AGENTS_BUILTIN_MCP_URL
        value: https://securo-mcp-dn75.onrender.com/mcp
      - key: FRONTEND_URL
        value: https://securo.opstintechnologies.com
      - key: DEBUG
        value: "false"
      - key: DEFAULT_CURRENCY
        value: PKR
      - key: TZ
        value: Asia/Karachi
      - key: LOCAL_AUTH_ENABLED
        value: "true"
      - key: REGISTRATION_ENABLED
        value: "false"
      - key: TRUSTED_PROXY_HOPS
        value: "1"
      - key: STORAGE_LOCAL_PATH
        value: /app/data/attachments
      - key: WEBAUTHN_RP_ID
        value: opstintechnologies.com
      - key: WEBAUTHN_RP_NAME
        value: Securo

  # Built-in MCP server: exposes the user's financial data as MCP tools that the
  # in-app agent (and, with a token, external clients) can call.
  - type: web
    name: securo-mcp
    runtime: docker
    plan: free
    region: oregon
    branch: main
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    dockerCommand: uvicorn mcp_server.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - fromGroup: securo-agents
      - key: DATABASE_URL
        sync: false

  - type: web
    name: securo-frontend
    runtime: docker
    plan: free
    region: oregon
    branch: main
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    healthCheckPath: /
    envVars:
      - key: PORT
        value: "8080"
      # nginx proxies /api/ to the backend's public URL.
      - key: BACKEND_URL
        value: https://securo-backend-zire.onrender.com
      - key: NGINX_RESOLVER
        value: 1.1.1.1
