# Render Blueprint for Securo — backend + MCP only.
#
# Deploy: Render Dashboard -> New + -> Blueprint -> pick this repo.
#
# NOTE: provisioned via the Render CLI; this file mirrors the live layout.
#
# Current topology (2026-11-10):
#   Frontend   -> Vercel        https://securo.opstintechnologies.com
#                 (frontend/vercel.json rewrites /api/* to the backend)
#   Backend    -> Render (here) https://securo-backend-zire.onrender.com
#   MCP server -> Render (here) https://securo-mcp-dn75.onrender.com
#   Postgres   -> Supabase (session pooler, ap-northeast-1) — external
#   Redis      -> Upstash                                    — external
#
# Free-plan notes:
#   * Only web services consume the workspace's 750 free instance hours/month.
#     Keeping ONE service warm 24/7 is ~730 h — inside the pool. The MCP server
#     sleeps when idle, so it adds little. Move the MCP to another workspace if
#     this one ever approaches the cap.
#   * External Postgres/Redis: no Render database or Key Value is created (a
#     free workspace allows only one of each anyway).
#   * Migrations run from backend/scripts/render-entrypoint.sh on boot.

envVarGroups:
  # Shared by the backend and the MCP server: their JWT secret must match.
  - name: securo-agents
    envVars:
      - key: AGENTS_ENABLED
        value: "true"
      - key: AGENTS_MCP_JWT_SECRET
        generateValue: true

services:
  - type: web
    name: securo-backend
    runtime: docker
    plan: free
    region: oregon
    branch: main
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/health
    dockerCommand: sh /app/scripts/render-entrypoint.sh
    envVars:
      - fromGroup: securo-agents
      - key: SECRET_KEY
        generateValue: true
      # External services (asyncpg driver / rediss:// TLS). Set manually.
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: AGENTS_BUILTIN_MCP_URL
        value: https://securo-mcp-dn75.onrender.com/mcp
      - key: FRONTEND_URL
        value: https://securo.opstintechnologies.com
      - key: DEBUG
        value: "false"
      - key: DEFAULT_CURRENCY
        value: PKR
      - key: TZ
        value: Asia/Karachi
      - key: LOCAL_AUTH_ENABLED
        value: "true"
      - key: REGISTRATION_ENABLED
        value: "false"
      - key: TRUSTED_PROXY_HOPS
        value: "1"
      - key: STORAGE_LOCAL_PATH
        value: /app/data/attachments
      - key: WEBAUTHN_RP_ID
        value: opstintechnologies.com
      - key: WEBAUTHN_RP_NAME
        value: Securo

  # Built-in MCP server: exposes the user's financial data as MCP tools for the
  # in-app agent (and, with a token, external clients).
  - type: web
    name: securo-mcp
    runtime: docker
    plan: free
    region: oregon
    branch: main
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    dockerCommand: uvicorn mcp_server.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - fromGroup: securo-agents
      - key: DATABASE_URL
        sync: false
